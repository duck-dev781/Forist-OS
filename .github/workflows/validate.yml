name: Validate project files

on:
  push:
    branches: [main, "project/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            README.md LICENSE ROADMAP.md CONTRIBUTING.md \
            docs/ARCHITECTURE.md docs/SECURITY.md docs/HARDWARE.md \
            docs/ACCOUNTS-AND-APPS.md docs/DESKTOP-SHELL.md \
            assets/forist-logo.svg assets/forist-wallpaper.svg \
            desktop/index.html desktop/styles.css desktop/app.js; do
            test -s "$path"
          done
          echo "Required Forist OS project files are present."
      - name: Validate SVG XML
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ("assets/forist-logo.svg", "assets/forist-wallpaper.svg"):
              ET.parse(path)
              print(f"Valid SVG XML: {path}")
          PY
      - name: Check desktop shell script syntax
        shell: bash
        run: node --check desktop/app.js
